- conArtikel:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =fxHintergrund
    Children:
      - recKopfArtikel:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =72
            Fill: =fxPrimaer
      - icoZurueck:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            X: =12
            Y: =16
            Width: =40
            Height: =40
            Color: =Color.White
            Tooltip: ="Zurück"
            OnSelect: =Back()
      - lblKopfArtikel:
          Control: Label@2.5.1
          Properties:
            Text: =If(varNeu, "Neuer Artikel", "Artikel bearbeiten")
            X: =60
            Y: =0
            Width: =400
            Height: =72
            Size: =22
            FontWeight: =FontWeight.Semibold
            Color: =Color.White

      # ---------- Eingabefelder (zentrierte Spalte, max. 600 px breit) ----------
      - lblName_:
          Control: Label@2.5.1
          Properties:
            Text: ="Artikelname *"
            X: =(Parent.Width - Min(600, Parent.Width - 40)) / 2
            Y: =90
            Width: =Min(600, Parent.Width - 40)
            Height: =26
            FontWeight: =FontWeight.Semibold
      - txtName:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =varArtikel.Title
            X: =lblName_.X
            Y: =118
            Width: =lblName_.Width
            Height: =40

      - lblNummer_:
          Control: Label@2.5.1
          Properties:
            Text: ="Artikelnummer"
            X: =lblName_.X
            Y: =170
            Width: =lblName_.Width / 2 - 10
            Height: =26
            FontWeight: =FontWeight.Semibold
      - txtNummer:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =varArtikel.Artikelnummer
            X: =lblName_.X
            Y: =198
            Width: =lblNummer_.Width
            Height: =40
      - lblKat_:
          Control: Label@2.5.1
          Properties:
            Text: ="Kategorie"
            X: =lblName_.X + lblName_.Width / 2 + 10
            Y: =170
            Width: =lblName_.Width / 2 - 10
            Height: =26
            FontWeight: =FontWeight.Semibold
      - drpKat:
          Control: Classic/DropDown@2.3.1
          Properties:
            Items: =fxKategorien
            Default: =Coalesce(varArtikel.Kategorie.Value, "Sonstiges")
            X: =lblKat_.X
            Y: =198
            Width: =lblKat_.Width
            Height: =40

      - lblMenge_:
          Control: Label@2.5.1
          Properties:
            Text: ="Menge"
            X: =lblName_.X
            Y: =250
            Width: =lblName_.Width / 2 - 10
            Height: =26
            FontWeight: =FontWeight.Semibold
      - txtMenge:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =Coalesce(varArtikel.Menge, 0)
            Format: =TextFormat.Number
            X: =lblName_.X
            Y: =278
            Width: =lblMenge_.Width
            Height: =40
      - lblMindest_:
          Control: Label@2.5.1
          Properties:
            Text: ="Mindestbestand"
            X: =lblKat_.X
            Y: =250
            Width: =lblKat_.Width
            Height: =26
            FontWeight: =FontWeight.Semibold
      - txtMindest:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =Coalesce(varArtikel.Mindestbestand, 0)
            Format: =TextFormat.Number
            X: =lblKat_.X
            Y: =278
            Width: =lblKat_.Width
            Height: =40

      - lblLagerort_:
          Control: Label@2.5.1
          Properties:
            Text: ="Lagerort"
            X: =lblName_.X
            Y: =330
            Width: =lblName_.Width
            Height: =26
            FontWeight: =FontWeight.Semibold
      - txtLagerort:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =varArtikel.Lagerort
            X: =lblName_.X
            Y: =358
            Width: =lblName_.Width
            Height: =40

      - lblBemerkung_:
          Control: Label@2.5.1
          Properties:
            Text: ="Bemerkung"
            X: =lblName_.X
            Y: =410
            Width: =lblName_.Width
            Height: =26
            FontWeight: =FontWeight.Semibold
      - txtBemerkung:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =varArtikel.Bemerkung
            Mode: =TextMode.MultiLine
            X: =lblName_.X
            Y: =438
            Width: =lblName_.Width
            Height: =100

      # ---------- Hinweis bei niedrigem Bestand ----------
      - lblWarnung:
          Control: Label@2.5.1
          Properties:
            Text: ="⚠ Bestand liegt unter dem Mindestbestand – bitte nachbestellen."
            Visible: =Value(txtMenge.Text) < Value(txtMindest.Text)
            X: =lblName_.X
            Y: =548
            Width: =lblName_.Width
            Height: =30
            Color: =fxRot

      # ---------- Aktionen ----------
      - btnSpeichern:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Speichern"
            X: =lblName_.X + lblName_.Width - 160
            Y: =590
            Width: =160
            Height: =44
            Fill: =fxPrimaer
            Color: =Color.White
            DisplayMode: =If(IsBlank(Trim(txtName.Text)), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =IfError(
                  Patch(
                      Inventar,
                      If(varNeu, Defaults(Inventar), LookUp(Inventar, ID = varArtikel.ID)),
                      {
                          Title: Trim(txtName.Text),
                          Artikelnummer: Trim(txtNummer.Text),
                          Kategorie: {Value: drpKat.Selected.Value},
                          Menge: Value(txtMenge.Text),
                          Mindestbestand: Value(txtMindest.Text),
                          Lagerort: Trim(txtLagerort.Text),
                          Bemerkung: txtBemerkung.Text
                      }
                  );
                  Notify("Artikel gespeichert.", NotificationType.Success);
                  Back(),
                  Notify("Speichern fehlgeschlagen: " & FirstError.Message, NotificationType.Error)
              )
      - btnAbbrechen:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Abbrechen"
            X: =btnSpeichern.X - 170
            Y: =590
            Width: =160
            Height: =44
            Fill: =Color.White
            Color: =fxPrimaer
            BorderColor: =fxPrimaer
            BorderThickness: =1
            OnSelect: =Back()
      - btnLoeschen:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Löschen"
            Visible: =!varNeu
            X: =lblName_.X
            Y: =590
            Width: =140
            Height: =44
            Fill: =Color.White
            Color: =fxRot
            BorderColor: =fxRot
            BorderThickness: =1
            OnSelect: =Set(varLoeschenBestaetigen, true)

      # ---------- Lösch-Bestätigung ----------
      - recOverlay:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =varLoeschenBestaetigen
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.45)
      - recDialog:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =varLoeschenBestaetigen
            X: =(Parent.Width - 420) / 2
            Y: =(Parent.Height - 180) / 2
            Width: =420
            Height: =180
            Fill: =Color.White
      - lblDialog:
          Control: Label@2.5.1
          Properties:
            Visible: =varLoeschenBestaetigen
            Text: ="Artikel """ & varArtikel.Title & """ wirklich löschen?"
            X: =recDialog.X + 20
            Y: =recDialog.Y + 20
            Width: =380
            Height: =70
            Size: =14
      - btnDialogNein:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =varLoeschenBestaetigen
            Text: ="Abbrechen"
            X: =recDialog.X + 60
            Y: =recDialog.Y + 110
            Width: =140
            Height: =44
            Fill: =Color.White
            Color: =fxPrimaer
            BorderColor: =fxPrimaer
            BorderThickness: =1
            OnSelect: =Set(varLoeschenBestaetigen, false)
      - btnDialogJa:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =varLoeschenBestaetigen
            Text: ="Löschen"
            X: =recDialog.X + 220
            Y: =recDialog.Y + 110
            Width: =140
            Height: =44
            Fill: =fxRot
            Color: =Color.White
            OnSelect: |-
              =Set(varLoeschenBestaetigen, false);
              IfError(
                  Remove(Inventar, LookUp(Inventar, ID = varArtikel.ID));
                  Notify("Artikel gelöscht.", NotificationType.Success);
                  Back(),
                  Notify("Löschen fehlgeschlagen: " & FirstError.Message, NotificationType.Error)
              )
